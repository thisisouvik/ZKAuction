name: ZKAuction CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Contract Tests ──────────────────────────────────────────────────
  contract-tests:
    name: "Contract Tests (Vitest)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run contract test suite
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 2: TypeScript Check ────────────────────────────────────────────────
  typecheck:
    name: "TypeScript (tsc --noEmit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 3: Next.js Production Build ───────────────────────────────────────
  build:
    name: "Next.js Production Build"
    runs-on: ubuntu-latest
    needs: [typecheck]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: TestNet
          NEXT_PUBLIC_NODE_WS_URL: wss://rpc.testnet-01.midnight.network/ws
          NEXT_PUBLIC_INDEXER_URI: https://indexer.testnet-01.midnight.network/api/v1/graphql
          NEXT_PUBLIC_INDEXER_WS_URI: wss://indexer.testnet-01.midnight.network/api/v1/graphql
          NEXT_PUBLIC_PROOF_SERVER_URI: https://proving.testnet-01.midnight.network
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ── Summary badge job (all must pass) ─────────────────────────────────────
  ci-success:
    name: "✅ CI Passed"
    runs-on: ubuntu-latest
    needs: [contract-tests, typecheck, build]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.contract-tests.result }}" != "success" || \
                "${{ needs.typecheck.result }}"    != "success" || \
                "${{ needs.build.result }}"        != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed!"
          echo "  contract-tests: ${{ needs.contract-tests.result }}"
          echo "  typecheck:      ${{ needs.typecheck.result }}"
          echo "  build:          ${{ needs.build.result }}"
